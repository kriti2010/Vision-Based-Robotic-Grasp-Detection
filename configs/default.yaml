# Full reproduction configuration (~1.5 hours on GPU / CPU)
mode: "default"
device: "cuda"

data:
  base_scenes: 200
  base_seed_start: 0
  antipodal_per_scene: 24
  perturbed_per_scene: 24
  data_dir: "data/base"

train:
  batch_size: 64
  base_steps: 20000
  lr: 0.0003
  device: "cuda"

rounds:
  round1_scenes: 300
  round1_seed_start: 600000
  round1_steps: 12000
  round2_scenes: 1200
  round2_seed_start: 700000
  round2_steps: 12000

episodes:
  views_T: 4
  samples_N: 32
  steps_K: 12
  fusion_episodes: 500
  calib_episodes: 500
  test_episodes: 500
  fusion_seed_start: 100000
  calib_seed_start: 200000
  test_seed_start: 300000

risk:
  alphas: [0.05, 0.10, 0.20]
  num_lambdas: 201
  bound_check_resplits: 200
